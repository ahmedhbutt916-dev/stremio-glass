name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37 (Android 16)
        run: |
          # Try stable package name first, then preview channel
          sdkmanager --install "platforms;android-37" 2>/dev/null || \
          sdkmanager --install "platforms;android-Baklava" 2>/dev/null || \
          sdkmanager --channel=3 --install "platforms;android-37" 2>/dev/null || \
          echo "SDK 37 not found, listing available platforms:" && sdkmanager --list 2>/dev/null | grep "platforms;android" | head -10

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x download/stremio-glass/gradlew

      - name: Build debug APK
        working-directory: download/stremio-glass
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stremio-glass-debug
          path: download/stremio-glass/app/build/outputs/apk/debug/*.apk
          retention-days: 30
